<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>To-Do or Not To-Do</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <script src="https://unpkg.com/htmx.org@2"></script>
    <style>
      .task-title-done { color: var(--pico-muted-color); }
      .btn-delete { background-color: #dfc2c4; border-color: #d99da3; color: #771d25; }
      .btn-add { background-color: #bcd0c7; border-color: #93baa8; color: #0e492d; }
      .btn-edit { background-color: #e6dbb9; border-color: #e6cf8c; color: #5c4503; }
      .checkbox-done:checked {
        --pico-background-color: #29712d;
        --pico-border-color: #29712d;
      }
      .btn-sm {
        font-size: 0.8rem;
        padding: 0.6rem 0.8rem;
      }
    </style>
  </head>
  <body>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
