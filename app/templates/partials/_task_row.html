<tr>
  <td>
    <input
      type="checkbox"
      {% if task.completed %}checked{% endif %}
      hx-post="/tasks/{{ task.id }}/toggle"
      hx-target="#task-list"
      hx-swap="innerHTML"
    />
  </td>
  <td>{% if task.completed %}<s>{{ task.title }}</s>{% else %}{{ task.title }}{% endif %}</td>
  <td>{{ task.due_date or "" }}</td>
  <td>{{ task.priority.value if task.priority else "" }}</td>
  <td>
    <button
      hx-get="/tasks/{{ task.id }}/edit"
      hx-target="#task-list"
      hx-swap="innerHTML"
    >
      Edit
    </button>
    <button
      hx-delete="/tasks/{{ task.id }}"
      hx-target="#task-list"
      hx-swap="innerHTML"
      hx-confirm="Delete this task?"
    >
      Delete
    </button>
  </td>
</tr>
